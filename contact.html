<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contact — Novatech</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 32px 20px;
			background: #f3efe7;
			color: #292b27;
			font: 16px/1.5 system-ui, sans-serif;
		}
		main {
			width: min(100%, 560px);
			padding: clamp(28px, 6vw, 52px);
			border: 1px solid #e4ded2;
			border-radius: 3px;
			background: #fffdf8;
			box-shadow: 8px 8px 0 #e5dfd3;
		}
		.back-link {
			display: inline-block;
			margin-bottom: 18px;
			color: #a05235;
			font-size: .9rem;
			font-weight: 700;
			text-decoration: none;
		}
		.back-link:hover { text-decoration: underline; }
		.label {
			margin: 0 0 10px;
			color: #a05235;
			font-size: .75rem;
			font-weight: 700;
			letter-spacing: .12em;
			text-transform: uppercase;
		}
		h1 { max-width: 13ch; margin: 0; font: 500 clamp(2rem, 7vw, 2.7rem)/1.08 Georgia, serif; letter-spacing: -.035em; }
		.intro { margin: 12px 0 32px; color: #77766f; }
		.field { margin-bottom: 18px; }
		label { display: block; margin-bottom: 6px; font-size: .9rem; font-weight: 650; }
		input, textarea {
			width: 100%;
			padding: 11px 12px;
			border: 1px solid #ded9cf;
			border-radius: 3px;
			background: #fffdf8;
			color: inherit;
			font: inherit;
		}
		input:focus, textarea:focus { outline: 2px solid #c68162; outline-offset: 1px; }
		textarea { min-height: 120px; resize: vertical; }
		button {
			width: 100%;
			padding: 12px;
			border: 0;
			border-radius: 3px;
			background: #a05235;
			color: #fff;
			font: inherit;
			font-weight: 650;
			cursor: pointer;
		}
		button:hover { background: #813d27; }
	</style>
</head>
<body>
	<main>
		<p class="label">Novatech · Contact</p>
		<h1>Parlons de votre projet.</h1>
		<p class="intro">Quelques lignes suffisent pour commencer.</p>

		<form action="#" method="post">
			<div class="field">
				<label for="nom">Nom</label>
				<input id="nom" name="nom" type="text" autocomplete="name" required>
			</div>
			<div class="field">
				<label for="email">E-mail</label>
				<input id="email" name="email" type="email" autocomplete="email" required>
			</div>
			<div class="field">
				<label for="sujet">Sujet</label>
				<input id="sujet" name="sujet" type="text" required>
			</div>
			<div class="field">
				<label for="message">Message</label>
				<textarea id="message" name="message" required></textarea>
			</div>
			<button type="submit">Envoyer le message <span aria-hidden="true">→</span></button>
		</form>
	</main>
</body>
</html>
